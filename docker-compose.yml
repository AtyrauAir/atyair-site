# =============================================================================
# atyair — Docker Compose оркестратор
# Запуск: docker compose up -d
# Остановка: docker compose down
# Логи: docker compose logs -f [service_name]
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + TimescaleDB
  # Используем официальный образ TimescaleDB (включает Postgres 16)
  # ---------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: atyair_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      # Данные БД сохраняются в именованном volume
      - postgres_data:/var/lib/postgresql/data
      # SQL-скрипты инициализации выполняются при первом запуске
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atyair_net
    # Наружу порт НЕ открываем — Postgres доступен только внутри Docker-сети

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # Опрашивает Open-Meteo, хранит данные в Postgres, отдаёт API для фронта
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atyair_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atyair_net
    # Порт наружу не пробрасываем — Nginx проксирует
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Nginx — веб-сервер и обратный прокси
  # Отдаёт фронтенд (статику), проксирует /api/* на backend
  # Позже добавим SSL через Let's Encrypt
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: atyair_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      # Для Let's Encrypt (добавим позже)
      - certbot_www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - atyair_net
    environment:
      TZ: ${TZ}

# =============================================================================
# Volumes — постоянные хранилища данных
# =============================================================================
volumes:
  postgres_data:
    name: atyair_postgres_data
  certbot_www:
    name: atyair_certbot_www
  certbot_conf:
    name: atyair_certbot_conf

# =============================================================================
# Networks — внутренняя сеть между контейнерами
# =============================================================================
networks:
  atyair_net:
    name: atyair_net
    driver: bridge
